<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>input tag</title>
</head>
<body dir="ltr">
    <!-- input select -->
    <form action="">
        <select name="" id="">
            <option value="">تهران</option>
            <option value="">اصفهان</option>
            <option value="">کرمان</option>
        </select>
     </form>
     <hr>
    <form action="" method="" target="">
        <input type="checkbox" id="" name="" value="">
        <input type="color" id="" name="" disabled>
        <input type="email" id="" name="" placeholder="Email">
        <input type="file" name="" id="" class="" multiple>
        <input type="number" name="" id="" class="" min="" max="" step="" placeholder="Age">
        <input type="password" name="" id="" class="" placeholder="Password">

        <h3>مرد</h3>
        <input type="radio" name="gender" value="Male">
        <h3>زن</h3>
        <input type="radio" name="gender" value="Female">

        <input type="range" id="" name="" class="" min="0" max="100" step="2" value="25">
        <input type="text" placeholder="Write something" name="" id="" class="" value="">
        <input type="reset">
        <input type="submit" value="Login">
    </form>

    <form action="" method="" target="" class="form_2">
        <input type="email" name="" id="" placeholder="Enter your email" autofocus>
        <input type="password" name="" id="" placeholder="Enter your password">
        <input type="reset">
        <input type="submit" value="Login">
    </form>

</body>
</html>
